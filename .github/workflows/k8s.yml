name: Kubernetes manifest validation workflow

on:
  push:
    branches:
      - main

    paths:
      - 'kubernetes/**'
      - '.github/workflows/k8s.yml'

jobs:
  validate-kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Kubernetes directory structure
        run: ls -R kubernetes

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Validate YAML files
        run: |
          find kubernetes -type f \( -name "*.yaml" -o -name "*.yml" \) ! -path "*/helm/*"| while read -r file; do
            echo "Linting $file"
            yamllint "$file"
          done

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm charts
        run: |
          for chart in kubernetes/helm/*; do
            if [ -d "$chart" ]; then
              echo "Linting Helm chart: $chart"
              helm lint "$chart"
            fi
          done

      - name: Render Helm templates
        run: |
          for chart in kubernetes/helm/*; do
            if [ -d "$chart" ]; then
              echo "Rendering Helm templates for chart: $chart"
              helm template "$chart"
            fi
          done
